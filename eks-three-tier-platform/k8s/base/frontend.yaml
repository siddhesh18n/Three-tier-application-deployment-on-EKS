apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: three-tier
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/OWNER/REPOSITORY-frontend:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /nginx-health, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /nginx-health, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: three-tier
spec:
  selector: { app: frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
  type: LoadBalancer
