apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: three-tier-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/REPOSITORY.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: three-tier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
